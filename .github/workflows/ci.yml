# Intégration continue (§57, §64).
#
# Toute Pull Request et tout push sur `main` déclenchent la chaîne complète.
# Une régression fait échouer la CI — c'est l'exigence explicite du §57.
#
# Ce workflow ne touche JAMAIS la base de production : les tests d'intégration
# utilisent un SQLite en mémoire (§52), et aucun secret n'est nécessaire.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Une PR mise à jour annule le run précédent : inutile de consommer des
# minutes gratuites sur du code déjà remplacé (§30).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # 1. Format
      - name: Vérifier le formatage
        run: pnpm run format:check

      # 2. Lint
      - name: Lint
        run: pnpm run lint

      # 3. Types
      - name: Vérification des types
        run: pnpm run typecheck

      # 4-6. Tests unitaires, d'intégration et de non-régression
      - name: Tests (Node)
        run: pnpm run test

      - name: Tests (frontend)
        run: pnpm --filter @maioun/frontend run test

      # 7. Build
      - name: Build du frontend
        run: pnpm --filter @maioun/frontend run build

      # 9. Secrets — voir aussi le job dédié ci-dessous
      - name: Vérification des secrets
        run: pnpm run check:secrets

      # 10. Le Worker désigne-t-il encore CE dépôt ?
      #
      # C'est la seule configuration qui ne se déduit pas : le Worker se déploie
      # d'une machine, hors de GitHub. Au renommage du 2026-09-10, son
      # `SITE_URL` a gardé l'ancien nom et les liens de mot de passe sont partis
      # vers une page morte, sans que rien ne le signale. Désormais, la CI rougit.
      - name: Cohérence du Worker avec le dépôt
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          toml=packages/worker/wrangler.toml
          site=$(sed -n 's/^SITE_URL *= *"\(.*\)"/\1/p' "$toml")
          id=$(sed -n 's/^GITHUB_REPOSITORY_ID *= *"\(.*\)"/\1/p' "$toml")
          case "$site" in
            */"$REPO_NAME"/app/) ;;
            *) echo "::error file=$toml::SITE_URL ($site) ne porte pas le nom du dépôt ($REPO_NAME)"; exit 1 ;;
          esac
          [ "$id" = "$REPO_ID" ] || { echo "::error file=$toml::GITHUB_REPOSITORY_ID ($id) n'est pas celui du dépôt ($REPO_ID)"; exit 1; }
          echo "Worker cohérent : $site, dépôt n° $id"

  # 8. Tests E2E critiques, isolés pour ne pas ralentir le retour principal.
  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Installer le navigateur Playwright
        run: pnpm --filter @maioun/frontend exec playwright install --with-deps chromium

      - name: Lancer les scénarios E2E
        run: pnpm --filter @maioun/frontend run test:e2e

      - name: Conserver le rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # Analyse de secrets sur l'historique complet, en complément du scanner maison.
  secrets:
    name: Analyse de secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks a besoin de l'historique pour analyser les commits.
          fetch-depth: 0

      # Reste en v2 : c'est la dernière version majeure publiée par ce projet.
      # GitHub la force sur Node 24 en signalant la fin de Node 20 ; l'action
      # fonctionne, et la remplacer par une version qu'on n'a pas vérifiée
      # serait pire que l'avertissement. Idem pour `pnpm/action-setup@v4`.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

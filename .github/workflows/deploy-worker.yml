# Publie l'API — le Worker Cloudflare qui sert le site.
#
# POURQUOI CE FICHIER EXISTE. Le frontend se publiait tout seul à chaque
# poussée ; le Worker, lui, se déployait à la main. Relevé du 2026-09-23 : le
# dernier déploiement datait du 18 septembre et DIX commits avaient modifié
# l'API depuis — dont celui qui fait enfin entrer les annonces quand on relève
# son budget. Le correctif existait, il était testé, il était poussé, et il ne
# tournait nulle part. Rien ne le signalait : le site se mettait à jour, son
# API non, et l'écart ne se voyait qu'en comparant deux historiques.
#
# LES SECRETS NE SONT PAS ICI. `CLOUDFLARE_API_TOKEN` est un secret du dépôt ;
# ceux du Worker (base, jeton Turso, clé de session) vivent chez Cloudflare,
# posés une fois avec `wrangler secret put` — ce déploiement n'y touche pas.
#
# CE QUI DÉCLENCHE : tout ce que le Worker embarque. Il bundle les routes du
# collecteur et le paquet partagé : les oublier ferait exactement revivre le
# problème, en plus silencieux encore.

name: Déploiement de l'API

on:
  push:
    branches: [main]
    paths:
      - 'packages/worker/**'
      - 'packages/collector/src/server/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois, et c'est le dernier qui compte : deux
# poussées rapprochées ne doivent pas publier dans le désordre.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Déployer
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # LA COMPILATION D'ABORD, ET SÉPARÉMENT. `wrangler deploy` construit son
      # bundle sans vérifier les types : une erreur de type partirait en
      # production. On la veut ici, avant l'envoi.
      - name: Vérifier les types
        run: pnpm run typecheck

      - name: Déployer le Worker
        run: npx wrangler deploy
        working-directory: packages/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

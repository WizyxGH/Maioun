# Collecte planifiée dans le cloud (§29) — optionnel.
#
# Un seul workflow pour toutes les sources : le scheduler interne choisit
# lesquelles interroger à chaque réveil (§7, §30). Inactif tant que
# CLOUD_COLLECT_ENABLED n'est pas à `true` — un fork reste 100% local.

name: Collecte

on:
  schedule:
    # Toutes les 30 minutes. Le scheduler interne filtre ensuite : une source
    # dont l'intervalle n'est pas écoulé n'émet aucune requête.
    #
    # MINUTES DÉCALÉES, volontairement. GitHub ne garantit pas la ponctualité
    # des crons et écarte les réveils quand la file est chargée : sur `*/30`,
    # une seule collecte planifiée sur neuf est partie le 2026-09-02, toutes
    # les autres ayant été demandées à `:00` et `:30`, les minutes les plus
    # encombrées. Rien ne le garantit non plus ici, mais la file y est moins
    # longue.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Mode backfill (récupération d’annonces plus anciennes)'
        type: boolean
        default: false
      verbose:
        description: 'Journalisation détaillée'
        type: boolean
        default: false

# Deux collectes simultanées écriraient en concurrence dans Turso et
# doubleraient les requêtes vers les sources.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    name: Cycle de collecte
    runs-on: ubuntu-latest
    # Borne dure : une source qui traîne ne doit pas consommer le quota.
    timeout-minutes: 20
    # Sans base cloud configurée, on ne consomme aucune minute.
    if: ${{ vars.CLOUD_COLLECT_ENABLED == 'true' }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Construire les paquets
        run: pnpm -r --filter "./packages/*" run build

      - name: Lancer la collecte (migrations incluses)
        run: |
          ARGS=""
          if [ "${{ inputs.backfill }}" = "true" ]; then ARGS="$ARGS --backfill"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          pnpm run collect -- $ARGS
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}

          # Web Push (§29) : la collecte émet elle-même vers les navigateurs
          # abonnés. Sans ces clés, le canal reste silencieusement inactif.
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          # PAS DE SITE_URL ICI : l'adresse des liens d'alerte se déduit de
          # GITHUB_REPOSITORY, que GitHub fournit à jour après un renommage. La
          # variable qu'on passait gardait l'ancien nom, et tous les liens sont
          # partis vers une page morte le 2026-09-10.

          # LE RELAIS DE PHOTOS, pour les notifications (§11). BEP publie ses
          # cliches en http ; un service worker ne charge pas une image http, et
          # la notification s affichait nue. Le Worker va la chercher et la rend
          # en https — encore faut-il savoir ou il est.
          API_URL: ${{ vars.API_URL }}

          # ALERTES PAR E-MAIL (§29), le canal qui double le push. Sans ces
          # deux valeurs, il reste silencieux et le journal le dit : rien ne
          # part, et surtout rien ne prétend être parti. Ce sont les mêmes que
          # celles du Worker — un seul compte Resend sert les deux.
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}

          # ACCÈS ABONNÉS : ILS SE DÉCLARENT DEPUIS LE SITE (§6, §26).
          #
          # Un abonnement est payé à titre PERSONNEL. Le ranger dans un secret
          # de dépôt le réservait à qui tient ce dépôt : un second compte ne
          # pouvait pas se servir de celui qu'il paie, ni même le déclarer.
          # Chacun le pose maintenant dans Paramètres → Accès abonnés, où il est
          # chiffré ; cette clé est ce qui permet au collecteur de le relire.
          # Le Worker doit avoir EXACTEMENT la même valeur.
          CREDENTIALS_KEY: ${{ secrets.CREDENTIALS_KEY }}

          # Les deux variables ci-dessous ne servent plus qu'à l'AMORÇAGE :
          # une machine qui collecte avant que quiconque ait ouvert l'écran.
          # Un accès déclaré depuis le site les emporte toujours.
          BEP_SUBSCRIBER_USER: ${{ secrets.BEP_SUBSCRIBER_USER }}
          BEP_SUBSCRIBER_PASSWORD: ${{ secrets.BEP_SUBSCRIBER_PASSWORD }}

          # Alertes e-mail des portails (§6, §10). CES VARIABLES MANQUAIENT, et
          # la source se désactivait donc en silence à chaque passage : elle ne
          # fonctionnait QUE lors d'une collecte lancée à la main sur la machine
          # de son propriétaire. Leboncoin et SeLoger n'ont pas d'autre voie
          # conforme — c'était donc tout un pan du gisement qui manquait, sans
          # qu'aucune erreur ne le dise.
          #
          # La boîte est celle DU PROJET : chaque compte y fait suivre ses
          # alertes depuis la sienne (voir ALERT_ADDRESS_TEMPLATE).
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_APP_PASSWORD: ${{ secrets.IMAP_APP_PASSWORD }}
          IMAP_HOST: ${{ vars.IMAP_HOST }}
          IMAP_MAILBOX: ${{ vars.IMAP_MAILBOX }}

          # Le MÊME gabarit que le Worker (§6). Le Worker MONTRE l'adresse à
          # chaque compte ; le collecteur s'en sert pour ROUTER ce qui arrive.
          # Configuré d'un seul côté, l'écran affiche une adresse dont les
          # messages n'appartiendraient à personne.
          ALERT_ADDRESS_TEMPLATE: ${{ vars.ALERT_ADDRESS_TEMPLATE }}

          # L'identité annoncée aux sites (§10) se déduit elle aussi du dépôt :
          # elle porte son adresse, et une valeur écrite ici périmerait.

          # §23 : interrupteur global du contact automatique. Absent = OFF.
          AUTO_CONTACT_ENABLED: ${{ vars.AUTO_CONTACT_ENABLED }}

          # Les points de référence ne passent plus par ici : chaque compte règle
          # les siens dans Paramètres → Adresses de référence. Les variables
          # REFERENCE_* que ce bloc transmettait n'étaient plus lues par rien.

# Worker Cloudflare — l'API du site publié (§28).
#
# Les trois secrets ne figurent PAS ici : ce fichier est versionné. On les
# dépose une fois avec `wrangler secret put` (voir docs/deployment.md).
#
#   TURSO_DATABASE_URL   l'adresse libsql:// de la base
#   TURSO_AUTH_TOKEN     le jeton, qui ne doit plus jamais atteindre un navigateur
#   SESSION_SECRET       la clé de signature des sessions
name = "rentfinder-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

[vars]
# L'origine autorisée à appeler l'API. Un « * » serait refusé par les
# navigateurs dès lors qu'on envoie un cookie — et il le serait à raison.
ALLOWED_ORIGIN = "https://wizyxgh.github.io"

# --- Alertes des portails par transfert (§6) --------------------------------
#
# Adresse montrée à chaque compte, `{token}` étant remplacé par son jeton. Elle
# doit désigner la boîte que LE COLLECTEUR lit (IMAP_USER), et cette boîte doit
# accepter le sous-adressage `+` — Gmail le fait, gratuitement et sans carte.
#
# Ce n'est pas un secret : sans le jeton d'un compte, l'adresse ne mène nulle
# part. Le jeton, lui, vit en base et n'est montré qu'à son propriétaire.
#
# Laissée vide, l'écran des réglages dit que la fonctionnalité n'est pas
# configurée au lieu d'afficher une adresse vers laquelle les alertes se
# perdraient en silence (§17).
ALERT_ADDRESS_TEMPLATE = "floriangertner0+{token}@gmail.com"

# --- Entrer avec un compte Google (§26) ---------------------------------------
#
# UNE VARIABLE, PAS UN SECRET : Google le publie, il voyage dans la page. Ce
# n'est pas une clé mais une IDENTITÉ — c'est en la comparant à celle que porte
# le jeton qu'on refuse un jeton émis pour une AUTRE application. C'est la
# vérification qu'on oublie, et la plus traître : sans elle, n'importe quel site
# utilisant Google pourrait rejouer les jetons de ses visiteurs pour entrer ici.
#
# OÙ LE TROUVER : console.cloud.google.com → API et services → Identifiants →
# Créer un ID client OAuth → Application Web. Y déclarer comme « origine
# JavaScript autorisée » l'adresse EXACTE du site (schéma et hôte, sans chemin
# ni barre finale) :
#
#   https://wizyxgh.github.io
#
# Aucun « URI de redirection » n'est nécessaire : le jeton est rendu dans la
# page, sans redirection (voir `google-auth.ts`).
#
# La MÊME valeur doit être donnée au site à sa construction, en variable de
# dépôt GitHub `GOOGLE_CLIENT_ID`. Absente ici, la route répond 501 ; absente
# là-bas, le bouton ne s'affiche pas. Dans les deux cas le mot de passe reste
# disponible, et rien ne ment (§17).
#
# GOOGLE_CLIENT_ID = "….apps.googleusercontent.com"

# --- Mot de passe oublié (§26) ------------------------------------------------
#
# Adresse publique de l'APPLICATION — pas celle de la page de présentation.
# C'est elle qui compose les liens de réinitialisation et de confirmation :
# envoyés vers la racine, ils déposeraient les gens sur le pitch, sans le jeton
# que l'application attend dans son adresse. Depuis que la présentation occupe
# la racine, l'application vit sous `/app/`.
SITE_URL = "https://wizyxgh.github.io/Maioun/app/"
#
# ELLE SUIT LE NOM DU DÉPÔT, et c'est la seule valeur de ce fichier dans ce cas :
# le Worker se déploie d'une machine, sans le contexte de GitHub qui permettrait
# de la déduire. Pour qu'un renommage ne la laisse plus périmer en silence, la
# CI la compare au nom réel du dépôt et échoue si elles divergent.

# Dépôt dont le réveil lance la collecte, par son IDENTIFIANT NUMÉRIQUE — il ne
# change ni au renommage ni au transfert, contrairement au nom. Obtenu par :
#
#   gh api repos/<propriétaire>/<nom> --jq .id
GITHUB_REPOSITORY_ID = "1353824560"

# Expéditeur des messages. La CLÉ d'API, elle, est un secret et se dépose à part :
#
#   npx wrangler secret put EMAIL_API_KEY
#
# Sans l'une ou l'autre, l'écran « mot de passe oublié » dit franchement que la
# fonctionnalité n'est pas configurée, au lieu d'annoncer un message qui ne
# partira jamais (§17).
#
# `onboarding@resend.dev` N'ÉCRIT QU'AU TITULAIRE DU COMPTE RESEND, tant qu'un  secret-scan-ignore
# domaine n'est pas vérifié. Cela suffit à une installation à un seul compte —
# c'est le cas ici — mais un DEUXIÈME compte ne recevrait jamais sa confirmation
# d'adresse ni son lien de réinitialisation, et Resend refuserait l'envoi sans
# que l'écran puisse le dire : de son point de vue la fonctionnalité EST
# configurée. Vérifier un domaine dans Resend est ce qui lève la limite.
EMAIL_FROM = "Maïoun <onboarding@resend.dev>"  # secret-scan-ignore : expediteur public de Resend

# --- Pièces du dossier de candidature (§25) — à activer si vous les voulez ---
#
# GRATUIT, SANS CARTE BANCAIRE. Le stockage clé-valeur des Workers est compris
# dans le plan gratuit : 1 Go, cent mille lectures et mille écritures par jour,
# vingt-cinq méga-octets par valeur. Un dossier en compte une dizaine de dix
# méga-octets au plus.
#
# R2 aurait été le choix naturel pour des fichiers, mais il exige d'enregistrer
# une carte AVANT de créer le moindre seau, y compris pour son palier gratuit.
#
# L'ESPACE EXISTE DEPUIS LE 2026-09-07, et il a manqué longtemps. Le bloc était
# resté commenté — un binding KV exige l'IDENTIFIANT d'un espace déjà créé, sans
# quoi le déploiement échoue — si bien que /api/documents répondait 501 : l'écran
# du dossier acceptait des fichiers que rien ne conservait. On croyait déposer
# ses pièces ; elles ne quittaient jamais le navigateur.
#
# L'identifiant n'est PAS un secret : il ne désigne qu'un espace, et seul le
# Worker qui le déclare peut y écrire.
#
#   npx wrangler kv namespace create DOCUMENTS   (si l'espace doit être recréé)

[[kv_namespaces]]
binding = "DOCUMENTS"
id = "de510f7eb71d40c9814b440d0e2b202e"

# --- Réveil de la collecte (§30) ---------------------------------------------
#
# LE CRON DE GITHUB NE TIENT PAS L'HEURE. Le workflow demande `7,37 * * * *`,
# soit quarante-huit passages par jour ; le 2026-09-07 il en a exécuté TROIS
# — 00:55, 06:00, 12:20. GitHub met les déclenchements `schedule` en file et les
# écarte quand elle est chargée, sans le dire. Sans collecte, aucune annonce
# n'entre et aucune alerte ne part, alors que tout paraît fonctionner : la
# dernière collecte a réussi, elle date simplement.
#
# Les Cron Triggers de Cloudflare, eux, sont fiables et compris dans le plan
# gratuit. Le Worker ne collecte pas — il n'a ni Node ni le temps qu'il
# faudrait — il demande à GitHub d'exécuter le workflow, ce qui compte comme un
# déclenchement MANUEL et échappe donc à la file des `schedule`.
#
# Le `schedule` du workflow reste en place : il ne coûte rien et sert de filet.
#
# IL FAUT UN JETON, à déposer une fois :
#
#   npx wrangler secret put GITHUB_DISPATCH_TOKEN
#
# Un jeton FIN (fine-grained), sur ce seul dépôt, avec la permission
# « Actions: Read and write » et rien d'autre. Sans lui, le réveil se tait et
# l'écrit dans le journal (`npx wrangler tail`). Le dépôt visé est désigné par
# `GITHUB_REPOSITORY_ID`, plus haut dans `[vars]`.
[triggers]
crons = ["7,37 * * * *"]

# --- Journal du Worker (§17) ---------------------------------------------------
#
# `wrangler tail` ne montre QUE ce qui passe pendant qu'on l'écoute : un refus
# d'envoi survenu il y a dix minutes est déjà perdu. Or c'est exactement ce
# qu'on cherche à comprendre — un message que le fournisseur a refusé ne laisse
# aucune trace ailleurs, et l'écran ne peut en dire que ce que le Worker a
# journalisé.
#
# Compris dans le plan gratuit, avec une rétention de trois jours.
[observability]
enabled = true

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f172a" />
    <!-- Outil personnel : aucune raison d'être indexé. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- Favicon en SVG inline : l'emoji est dessiné par le navigateur, donc
      aucun fichier à héberger ni requête supplémentaire. -->
    <!-- UN SEUL FICHIER pour l identite de l application : l onglet le montre,
      et les icones des notifications en sont tirees (scripts/build-app-icons).
      L emoji vivait ici en `data:`, et les notifications montraient un autre
      dessin — deux maisons pour une seule application. -->
    <link rel="icon" href="%BASE_URL%favicon.svg" />
    <!-- Manifeste requis pour installer le site sur l'écran d'accueil, seule
      façon de recevoir des notifications sur iOS (16.4+). -->
    <!-- CHEMIN ABSOLU, PAS RELATIF. Sur une adresse profonde — /listing/xyz —
      un href relatif se résout en /listing/manifest.webmanifest, que le
      serveur ne connaît pas : 404 dans la console de chaque fiche ouverte
      directement. `%BASE_URL%` porte le préfixe de publication. -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <title>Maïoun — locations à Nice</title>
    <meta
      name="description"
      content="Les annonces de location de Nice, sans doublons, avec les alertes, le suivi des contacts et votre dossier."
    />
    <!-- Non indexée, mais PARTAGÉE : un lien vers une annonce collé dans une
      messagerie montre cet aperçu. Le site étant statique, il est le même pour
      toutes les adresses de l'application. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maïoun" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="%SITE_URL%app/" />
    <meta property="og:title" content="Maïoun — locations à Nice" />
    <meta
      property="og:description"
      content="Toutes les locations de Nice au même endroit, sans doublons, avec une alerte dès qu’un logement correspond."
    />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Maïoun — le bon appartement avant les autres." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
